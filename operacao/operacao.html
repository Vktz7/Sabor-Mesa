<!doctype html><html lang="pt-BR">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sabor & Mesa | Operação</title>
    <link rel="stylesheet" href="painel.css">
  </head>
  <body>
    <header>
    <h1>Sabor & Mesa · Operação</h1>
    <button id="sair" class="secundario">Sair</button>
    </header>
    <main>
      <section id="login" class="login">
        <h2>Acesso da equipe</h2>
        <label>E-mail</label>
        <input id="email" type="email">
        <label>Senha</label>
        <input id="senha" type="password">
        <p id="erro"></p>
        <button id="entrar">Entrar</button>
      </section>
      <section id="area" class="oculto"><div class="barra">
        <div>
          <h2>Pedidos em andamento</h2>
          <small>Atualização automática a cada 10 segundos.</small>
        </div>
        <button id="atualizar" class="secundario">Atualizar</button>
      </div>
          <div id="pedidos" class="pedidos"></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="operacao.js"></script>
  </body>
</html>
